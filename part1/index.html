// ================= the living room, one-point perspective =================
const F = { x0: -300, x1: 1380, y0: -120, y1: 2200 }, B = { x0: 210, x1: 870, y0: 650, y1: 1210 }, Z1 = (F.x1 - F.x0) / (B.x1 - B.x0);

  poly(g, Q([[0.88, 0.28, 0], [1, 0.28, 0], [1, 0.28, 0.68], [0.88, 0.28, 0.68]]), '#aeb2b8');

    if (fm !== 'off' && fm !== 'dead') { const p = P(0.88, 0.34, 0.5); glow(g, p[0], p[1], 260, '#ff2a1f', 0.7); } }

// a hero card in the room at (u, d), lifted by m metres (sitting), with a pose already set

// ================= the city skyline (exterior) =================
