    b.velocity.set((R() - 0.2) * 7, 3 + R() * 4, (R() - 0.5) * 6); b.angularVelocity.set(R() * 10, R() * 10, R() * 10); world.addBody(b); return b; });
}, 30);

function drawTV(mode, t) {
  const g = tvCv.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0);
  if (mode === 'off') { g.fillStyle = '#050506'; g.fillRect(0, 0, 512, 288); }

    g.fillStyle = '#1a0606'; g.fillRect(0, 0, 512, 288); const R = rng(1 + Math.floor(t * 12));
    for (let k = 0; k < 26; k++) { g.fillStyle = `rgba(${200 + R() * 55},${R() * 40},${R() * 30},${0.3 + R() * 0.6})`; g.fillRect(0, R() * 288, 512, 2 + R() * 12); }
    g.fillStyle = '#ffffff'; g.font = '700 54px Oswald'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('SINAL INVADIDO', 256 + (R() - 0.5) * 16, 144);
  } else if (mode === 'order') {
    g.fillStyle = '#b3120c'; g.fillRect(0, 0, 512, 288); g.fillStyle = 'rgba(0,0,0,0.25)'; for (let y = 0; y < 288; y += 6) g.fillRect(0, y, 512, 2);
    g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '700 64px Oswald'; g.fillText('NÃO SAIAM', 256, 110); g.fillText('DE CASA', 256, 185);
  }
  tvTex.needsUpdate = true;
}
function drawFridge(mode, t) {
  const g = frCv.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.textAlign = 'center'; g.textBaseline = 'middle';
  if (mode === 'off') { g.fillStyle = '#0b0c0e'; g.fillRect(0, 0, 256, 384); g.fillStyle = '#2b6cff'; g.beginPath(); g.arc(220, 30, 6, 0, 7); g.fill(); }
  else {
    g.fillStyle = '#2a0503'; g.fillRect(0, 0, 256, 384); g.fillStyle = '#ff3b2f';
    if (mode === 'hello') { g.font = '700 70px Oswald'; g.fillText('OLÁ,', 128, 150); g.fillText('7B.', 128, 235); }
    else { g.font = '700 34px "JetBrains Mono"'; g.fillText('ESTOQUE', 128, 70); g.font = '700 96px Oswald'; g.fillText('30', 128, 160); g.font = '700 40px Oswald'; g.fillText('DIAS', 128, 225);
      if (mode === 'sent') { const k = clamp((t) / 0.9); g.fillStyle = '#3a0a07'; g.fillRect(28, 280, 200, 26); g.fillStyle = '#ff3b2f'; g.fillRect(28, 280, 200 * k, 26);
        g.font = '700 28px "JetBrains Mono"'; g.fillText(k >= 1 ? 'ENVIADO' : 'ENVIANDO', 128, 335); } }
  }
  frTex.needsUpdate = true;
}

// ================= state as a pure function of time =================
const tApaga = w(0, 'apagam'), tVolta = w(1, 'voltam'), tUnplug = w(8, 'desligue') + 0.35, tFr = w(15, 'acende'), tFio = w(17, 'fio');
const tCrash = w(5, 'obedece'), tClick = w(19, 'clique'), tOpen = tClick + 0.7;
// the story clock: [video time, minutes after 23:00]
const CLOCK = [[0, 58], [L(2), 63], [L(6), 80], [L(9), 85], [L(10), 160], [L(14), 166], [L(15), 192], [L(18), 240], [T.voice_end, 247]];
function clockAt(t) { let m = CLOCK[0][1]; for (let i = 1; i < CLOCK.length; i++) if (t >= CLOCK[i - 1][0]) m = lerp(CLOCK[i - 1][1], CLOCK[i][1], clamp((t - CLOCK[i - 1][0]) / (CLOCK[i][0] - CLOCK[i - 1][0]))); m = Math.floor(m); const h = (23 + Math.floor(m / 60)) % 24; return String(h).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function world(t) {
  // city windows: lit, then dark, then red
  const R = rng(9);
  for (const q of cityWins) { const d = R() * 0.5; q.mesh.material.color.set(t < tApaga + d * 0.4 ? '#ffd08a' : t < tVolta + d ? '#07080b' : (R() < 0.85 ? '#ff2a1f' : '#07080b')); }
  // the TV
  drawTV(t < tApaga ? 'glitch' : t < tVolta ? 'off' : t < tUnplug ? 'order' : 'off', t);
  tvRed.intensity = t < tApaga ? 6 : (t >= tVolta && t < tUnplug) ? 14 : 0;
  for (const m of routerLeds) m.material.color.set(t < tUnplug ? ((Math.floor(t * 7 + m.position.x * 30) % 3) ? '#39ff7a' : '#0f5f2c') : '#050605');
  // the fridge
  const fm = t < tFr ? 'off' : t < w(16, 'contou') ? 'hello' : t < w(16, 'E') ? 'stock' : t < tFio ? 'sent' : 'dead';
  drawFridge(fm === 'dead' ? 'off' : fm, t - w(16, 'E')); if (fm === 'dead') { const g = frCv.getContext('2d'); g.fillStyle = '#060607'; g.fillRect(0, 0, 256, 384); frTex.needsUpdate = true; }
  frGlow.intensity = (fm !== 'off' && fm !== 'dead') ? 5 * (0.85 + 0.15 * Math.sin(t * 20)) : 0;
  frCable.visible = t < tFio;
  // the lamp: warm, dimmer late at night
  lamp.userData.light.intensity = t < L(10) ? 7 : 4;
  // the smart lock and the door
  lockLed.material.color.set(t < tClick ? '#ff2b2b' : '#36ff6e');
  const knock = (t >= w(10, 'bate') && t < w(10, 'bate') + 1.0) ? Math.sin(t * 60) * 0.004 * (1 - (t - w(10, 'bate'))) : 0;
  fdoor.userData.open(t < tOpen ? knock : lerp(0, 1.25, ease((t - tOpen) / 3.2)));
  // the neighbor in the hall
  neighbor.mesh.visible = (t >= L(10) && t < w(14, 'somem') + 0.8) || t >= w(20, 'Ela');
  if (t < L(15)) {
    const leave = clamp((t - w(14, 'passos')) / 1.6);
    if (leave > 0) { const x = neighbor.walk(t * 1, { speed: 1.1, facing: -1 }); neighbor.mesh.position.set(4.35 + leave * 1.6, 0, -1.05 + leave * 2.6); }
    else { holding(neighbor, true, t); neighbor.mesh.position.set(4.35, 0, -1.05); }
  } else { holding(neighbor, false, t); neighbor.mesh.position.set(3.55, 0, -1.0); }
  hallLight.userData.light.intensity = 5 * (t > w(21, 'vizinha') && Math.sin(t * 31) > 0.7 ? 0.55 : 1);
  // the street: cars on their own, the crash, drones, a running crowd
  cars.forEach((cr, k) => {
    if (k === 0) {
      if (t < tCrash) { const d = tCrash - t; cr.position.set(4 - 15 * d, STREET_Y, -12.5 + 2.2 * clamp(1 - d / 0.8)); cr.rotation.set(0, 0.35 * clamp(1 - d / 0.8), 0); }
      else { cr.position.set(3.4, STREET_Y, -10.6); cr.rotation.set(0, 0.55, 0.0); }
      cr.userData.beam.intensity = t < tCrash ? 25 : (Math.sin(t * 40) > 0 ? 15 : 0);
    } else {
      const lane = k % 2 ? -15.8 : -12.2, dir = k % 2 ? -1 : 1, v = 7 + k * 1.3;
      const x = ((-3 + (k - 2) * 7 + dir * v * (t - 12.6) + 45) % 90 + 90) % 90 - 45;
      cr.position.set(x, STREET_Y, lane); cr.rotation.set(0, dir > 0 ? 0 : Math.PI, 0);

}

  if (tag === 'phone') phone(c, (g, x, y, w_, h_) => phoneUI(g, x, y, w_, h_, t), clamp(u / 0.25));

  if (tag === 'rule3back') ruleSticker(c, 3, ['NÃO ABRA', 'A PORTA'], spring(u) * 0.85, 470);
  if (t < END) hud(c, 1, clockAt(t));

  else drawCaptions(c, CHUNKS, t);
}
